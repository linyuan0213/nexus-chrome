    }
    # 管理前端（Vite 构建产物，SPA history 路由回退）
    location = /ui {
      return 301 /ui/;
    }
    # 带哈希的静态资源：长缓存（文件名变化即失效）
    location ~ ^/ui/assets/(.*)$ {
      alias /app/frontend/dist/assets/$1;
      add_header Cache-Control "public, max-age=31536000, immutable";
    }
    # 管理前端 SPA：index.html 不缓存，其余短缓存（发布后立即生效）
    location /ui/ {
      alias /app/frontend/dist/;
      try_files $uri $uri/ /ui/index.html;
      add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    # FastAPI 应用（HTTP + WebSocket /ws/events）
    location / {
      proxy_pass http://127.0.0.1:9851;
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection $connection_upgrade;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }
  }
}
