[project]
name = "nexus-chrome"
version = "3.2.6"
description = "Nexus Chrome Service - Browser automation service for Nexus Media"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "drissionpage>=4.2.0b14",
    "fake-useragent>=2.2.0",
    "fastapi>=0.122.0",
    "httpx2>=2.9.1",
    "loguru>=0.7.3",
    "pydantic>=2.13,<2.14",
    "pyquery>=2.0.1",
    "uvicorn>=0.38.0",
    "websockets>=14.0",
    "websockify>=0.10.0",
]

[dependency-groups]
dev = [
    "pytest>=9.0.3",
    "pytest-cov>=7.1.0",
    "ruff>=0.15.0",
    "pyright>=1.1.409",
    "pre-commit>=4.6.1",
]

[tool.ruff]
target-version = "py311"
line-length = 120
exclude = [
    ".git",
    ".venv",
    "__pycache__",
    "*.egg-info",
    "build",
    "dist",
]

[tool.ruff.lint]
select = [
    "E",  # pycodestyle errors（含 E402：模块级导入必须在顶部）
    "F",  # Pyflakes
    "I",  # isort
    "TID",  # flake8-tidy-imports（内部导入依赖规则）
    "PLC0415",  # 禁止函数级导入（导入一律写在文件顶部，防隐藏依赖）
    "S110",  # try-except-pass (do not silently swallow exceptions)
]
ignore = [
    "S101",  # assert
    "S311",  # pseudo-random generators
    "S404",  # subprocess
    "S603",  # subprocess-without-shell-equals-true
    "S607",  # start-process-with-partial-path
    "S608",  # hardcoded-sql-expression
]

[tool.ruff.lint.flake8-tidy-imports]
# 禁止相对导入（强制绝对导入，保持内部依赖方向清晰可读）
ban-relative-imports = "all"
# 禁止跨层反向依赖：core/fp 不得依赖 api/services；services 不得反向依赖 api
banned-module-level-imports = []

[tool.ruff.lint.isort]
# src 视为一方包：内部导入单独分组并排在标准库/第三方之后
known-first-party = ["src"]

[tool.ruff.lint.per-file-ignores]
"src/config/settings.py" = ["E501"]
# 测试豁免：允许函数级导入/宽松依赖方向，测试可自由引用被测模块
"tests/**" = ["TID", "PLC0415"]
"tests/test_challenge.py" = ["E501"]
"tests/test_challenge_resolve.py" = ["E501"]

[tool.pyright]
venvPath = "."
venv = ".venv"
pythonVersion = "3.11"
strict = ["src/**/*.py"]
exclude = [".venv", "__pycache__", "third_party"]
reportMissingImports = true
reportMissingTypeStubs = false
reportUnusedImport = true
reportOptionalMemberAccess = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v"
filterwarnings = [
    "ignore::DeprecationWarning:starlette.*",
]

[tool.coverage.run]
source_pkgs = ["src"]
omit = [
    "tests/*",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
]

[tool.uv]
prerelease = "allow"
