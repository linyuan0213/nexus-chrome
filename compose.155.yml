# 旁路 smoke：155.0.8044.0 构建验证栈（端口 9860，独立 data155）
# 用法: mkdir -p data155 && cp data/fp_config_center.db data155/
#       docker compose -f docker-compose.yml -f compose.155.yml up -d --build
services:
  nexus-chrome:
    image: linyuan0213/nexus-chrome:155.0.8044.0
    container_name: nexus-chrome-155
    build:
      args:
        CHROME_VERSION: "155.0.8044.0"
    ports:
      - "9860:9850"
    volumes:
      - ./data155:/app/data
      - /dev/shm:/dev/shm
